<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Seoul & Fukuoka 2026</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        :root {
            --bg-color: #0b111e;
            --card-bg: #151c2b;
            --text-main: #f0f6fc;
            --text-sub: #8b949e;
            --accent: #58a6ff;
            --border: #30363d;
            --tab-active: #58a6ff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        /* 頭部區塊 */
        header { text-align: center; padding: 40px 20px 20px; }
        .kr-jp { font-size: 1rem; color: var(--text-main); font-weight: bold; letter-spacing: 2px; }
        .title-city { font-size: 2.5rem; font-weight: 800; margin: 10px 0; color: var(--text-main); display: flex; justify-content: center; gap: 20px; }
        .title-city span:last-child { color: #8bb4f7; }
        .trip-dates { font-size: 0.9rem; color: var(--text-sub); }
        
        /* 天氣區塊 (可點擊) */
        .weather-widget { 
            display: inline-flex; justify-content: center; align-items: center; gap: 10px; 
            margin-top: 25px; padding: 10px 20px; border-radius: 20px;
            background: rgba(88, 166, 255, 0.1); border: 1px solid rgba(88, 166, 255, 0.3);
            text-decoration: none; color: var(--text-main); transition: all 0.3s;
            cursor: pointer;
        }
        .weather-widget:hover { background: rgba(88, 166, 255, 0.2); }
        .weather-icon { font-size: 1.8rem; }
        .weather-temp { font-size: 1.2rem; font-weight: bold; display: flex; flex-direction: column; align-items: flex-start; line-height: 1.2;}
        .weather-city { font-size: 0.75rem; color: var(--accent); font-weight: normal; }

        /* 分頁導覽列 */
        .tabs { 
            display: flex; border-bottom: 1px solid var(--border); 
            background-color: rgba(21, 28, 43, 0.5); overflow-x: auto; scrollbar-width: none;
        }
        .tabs::-webkit-scrollbar { display: none; }
        
        .tab-btn {
            flex: 1; min-width: 70px; text-align: center;
            background: none; border: none; color: var(--text-sub);
            padding: 15px 10px; font-size: 0.95rem; cursor: pointer;
            border-bottom: 2px solid transparent; transition: all 0.3s; white-space: nowrap;
        }
        .tab-btn.active { color: var(--accent); border-bottom: 2px solid var(--accent); font-weight: bold; }

        /* 內容區塊 */
        .tab-content { display: none; padding: 20px; max-width: 600px; margin: 0 auto; min-height: 50vh; }
        .tab-content.active { display: block; }

        /* 折疊卡片樣式 */
        details { background: var(--card-bg); margin-bottom: 15px; border-radius: 10px; border: 1px solid var(--border); overflow: hidden; }
        summary { padding: 16px; cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center; }
        summary::-webkit-details-marker { display: none; }
        summary::after { content: '▼'; font-size: 0.8em; color: var(--text-sub); transition: transform 0.3s; }
        details[open] summary::after { transform: rotate(180deg); }
        
        .content-inner { padding: 15px 16px; border-top: 1px solid var(--border); background: rgba(0,0,0,0.2); font-size: 0.9em; color: #c9d1d9; }
        .info-row { margin-bottom: 8px; }
        
        a.map-link { color: var(--accent); text-decoration: none; font-weight: bold; display: inline-flex; align-items: center; gap: 5px; }
        a.map-link:hover { text-decoration: underline; }
        
        .tag { background: rgba(88, 166, 255, 0.15); color: var(--accent); padding: 2px 8px; border-radius: 12px; font-size: 0.85em; margin-right: 10px; }
        .sub-text { font-size: 0.85em; color: var(--text-sub); display: block; margin-top: 4px; }
        
        .empty-state { text-align: center; color: var(--text-sub); margin-top: 50px; }
        .empty-state span { display: block; font-size: 0.9em; margin-top: 5px; }
        .loading { text-align: center; color: var(--accent); margin-top: 50px; font-weight: bold; }
    </style>
</head>
<body>

    <header>
        <div class="kr-jp">KR JP</div>
        <div class="title-city"><span>Seoul</span> <span>Fukuoka</span></div>
        <div class="trip-dates">2026 • 7月11日 → 7月19日 • 9天</div>
        
        <a id="weather-link" class="weather-widget" href="https://www.google.com/search?q=首爾天氣" target="_blank">
            <span class="weather-icon" id="weather-icon">⏳</span>
            <div class="weather-temp">
                <span id="weather-temp">載入中...</span>
                <span class="weather-city" id="weather-city">讀取天氣</span>
            </div>
        </a>
    </header>

    <nav class="tabs">
        <button class="tab-btn active" onclick="switchTab('flights')">✈️ 飛機</button>
        <button class="tab-btn" onclick="switchTab('hotels')">🏨 住宿</button>
        <button class="tab-btn" onclick="switchTab('itinerary')">🗺️ 行程</button>
        <button class="tab-btn" onclick="switchTab('food')">🍜 食</button>
    </nav>

    <main>
        <section id="flights" class="tab-content active"><div class="loading">📡 從 Google Sheet 同步資料中...</div></section>
        <section id="hotels" class="tab-content"><div class="loading">📡 從 Google Sheet 同步資料中...</div></section>
        <section id="itinerary" class="tab-content"><div class="loading">📡 從 Google Sheet 同步資料中...</div></section>
        <section id="food" class="tab-content"><div class="loading">📡 從 Google Sheet 同步資料中...</div></section>
    </main>

    <script>
        // Google Sheet ID
        const SHEET_ID = '1zGg0PWmEts0EGzBANZOEVV2437I-OXTHvzlDquMO_VA';

        // 產生 Google Maps 導航 URL
        function getMapLink(query) {
            if(!query) return '';
            return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(query)}`;
        }

        // 切換分頁
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            event.currentTarget.classList.add('active');
        }

        // 動態讀取單一 Google Sheet 分頁資料
        function fetchSheetData(sheetName) {
            const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(sheetName)}`;
            return new Promise((resolve, reject) => {
                Papa.parse(url, {
                    download: true,
                    header: true,
                    skipEmptyLines: true,
                    complete: results => resolve(results.data),
                    error: err => reject(err)
                });
            });
        }

        // 處理與渲染資料
        async function loadAllData() {
            try {
                // 平行抓取所有分頁 (請確保您的 Google Sheet 下方分頁名稱與這裡一致)
                const [flightsData, hotelsData, itineraryData, foodData] = await Promise.all([
                    fetchSheetData('飛機'),
                    fetchSheetData('住宿'),
                    fetchSheetData('行程'),
                    fetchSheetData('食')
                ]);

                renderFlights(flightsData);
                renderHotels(hotelsData);
                renderItinerary(itineraryData);
                renderFood(foodData);

            } catch (error) {
                console.error("資料讀取失敗:", error);
                document.querySelectorAll('.tab-content').forEach(el => {
                    el.innerHTML = `<div class="empty-state">⚠️ 資料讀取失敗<br><span>請確認 Sheet 是否公開且分頁名稱正確 ("飛機", "住宿", "行程", "食")</span></div>`;
                });
            }
        }

        // 渲染飛機
        function renderFlights(data) {
            const container = document.getElementById('flights');
            if(!data || data.length === 0) { container.innerHTML = `<div class="empty-state">無航班資料</div>`; return; }
            let html = '';
            data.forEach(f => {
                // 為了相容不同的欄位名稱，使用陣列值或常用屬性 (對應您的標題列)
                const keys = Object.keys(f);
                const no = f['航班號'] || f[keys[0]] || '';
                const date = f['日期'] || f[keys[1]] || '';
                const depTime = f['起飛時間'] || f[keys[2]] || '';
                const depLoc = f['起飛地點'] || f[keys[3]] || '';
                const arrTime = f['抵達時間'] || f[keys[4]] || '';
                const arrLoc = f['抵達地點'] || f[keys[5]] || '';
                const terminal = f['航廈'] || f[keys[6]] || '';
                const ref = f['預約代號'] || f[keys[7]] || '';
                const note = f['備註'] || f[keys[8]] || '';

                html += `
                    <details>
                        <summary>
                            <div>
                                <span class="tag">${no}</span>
                                <span>${depLoc} ✈️ ${arrLoc}</span>
                                <span class="sub-text">${date}</span>
                            </div>
                        </summary>
                        <div class="content-inner">
                            <div class="info-row"><b>起飛:</b> ${depTime} (${depLoc}) ${terminal ? '航廈: '+terminal : ''}</div>
                            <div class="info-row"><b>抵達:</b> ${arrTime} (${arrLoc})</div>
                            <div class="info-row"><b>預約代號:</b> <span style="color:var(--accent);">${ref || '無'}</span></div>
                            ${note ? `<div class="info-row"><b>備註:</b> ${note}</div>` : ''}
                        </div>
                    </details>`;
            });
            container.innerHTML = html;
        }

        // 渲染住宿
        function renderHotels(data) {
            const container = document.getElementById('hotels');
            if(!data || data.length === 0) { container.innerHTML = `<div class="empty-state">無住宿資料</div>`; return; }
            let html = '';
            data.forEach(h => {
                const keys = Object.keys(h);
                const inDate = h['入住日期'] || h['in'] || h[keys[0]] || '';
                const outDate = h['退房日期'] || h['out'] || h[keys[1]] || '';
                const name = h['飯店名'] || h['name'] || h[keys[2]] || '';
                const fullName = h['全名'] || h['fullName'] || h[keys[3]] || '';
                const room = h['房型'] || h['room'] || h[keys[4]] || '';
                const bf = h['早餐'] || h['bf'] || h[keys[5]] || '';
                const ref = h['預約號碼'] || h['ref'] || h[keys[6]] || '';

                const mapUrl = getMapLink(fullName || name);
                html += `
                    <details>
                        <summary>
                            <div style="width: 100%;">
                                <div style="font-weight:bold; font-size:1.1em;">${name}</div>
                                <span class="sub-text">${inDate} ~ ${outDate} | 早餐: ${bf}</span>
                            </div>
                        </summary>
                        <div class="content-inner">
                            <div class="info-row"><b>飯店名稱:</b> <br><a href="${mapUrl}" class="map-link" target="_blank">📍 ${fullName}</a></div>
                            <div class="info-row"><b>房型:</b> ${room}</div>
                            <div class="info-row"><b>預約號碼:</b> <span style="color:var(--accent);">${ref}</span></div>
                        </div>
                    </details>`;
            });
            container.innerHTML = html;
        }

        // 日期過濾邏輯
        function filterByDateRule(dataArray) {
            const today = new Date();
            const thresholdDate = new Date('2026/07/11');
            const yyyy = today.getFullYear();
            const mm = String(today.getMonth() + 1).padStart(2, '0');
            const dd = String(today.getDate()).padStart(2, '0');
            const todayStr = `${yyyy}/${mm}/${dd}`; // 格式：2026/07/11

            if (today < thresholdDate) return dataArray; // 7/11之前全列
            return dataArray.filter(item => {
                const itemDate = item['日期'] || item[Object.keys(item)[0]];
                return itemDate === todayStr;
            });
        }

        // 渲染行程
        function renderItinerary(data) {
            const container = document.getElementById('itinerary');
            const filteredData = filterByDateRule(data);
            if (filteredData.length === 0) {
                container.innerHTML = `<div class="empty-state">⚠️ 今日無行程安排<span>Enjoy your free time!</span></div>`;
                return;
            }
            let html = '';
            filteredData.forEach(i => {
                const keys = Object.keys(i);
                const date = i['日期'] || i[keys[0]] || '';
                const time = i['時間'] || i[keys[1]] || '';
                const event = i['行程'] || i[keys[2]] || '';
                const highlight = i['重點'] || i[keys[3]] || '';
                const address = i['地址'] || i[keys[4]] || '';
                const note = i['備註'] || i[keys[5]] || '';

                const mapUrl = getMapLink(address || event);
                html += `
                    <details>
                        <summary>
                            <div>
                                <span class="tag">🕒 ${time}</span>
                                <span style="font-weight:bold;">${event}</span>
                                <span class="sub-text">${date}</span>
                            </div>
                        </summary>
                        <div class="content-inner">
                            ${highlight ? `<div class="info-row"><b>行程重點:</b> ${highlight}</div>` : ''}
                            ${address ? `<div class="info-row"><b>地址:</b> <br><a href="${mapUrl}" class="map-link" target="_blank">📍 ${address}</a></div>` : ''}
                            ${note ? `<div class="info-row"><b>備註:</b> ${note}</div>` : ''}
                        </div>
                    </details>`;
            });
            container.innerHTML = html;
        }

        // 渲染食
        function renderFood(data) {
            const container = document.getElementById('food');
            const filteredData = filterByDateRule(data);
            if (filteredData.length === 0) {
                container.innerHTML = `<div class="empty-state">⚠️ 今日無餐廳安排<span>Explore local food!</span></div>`;
                return;
            }
            let html = '';
            filteredData.forEach(f => {
                const keys = Object.keys(f);
                const date = f['日期'] || f[keys[0]] || '';
                const type = f['分類'] || f[keys[1]] || '';
                const name = f['餐廳'] || f[keys[2]] || '';
                const localName = f['當地名稱'] || f['餐廳_Local'] || f[keys[3]] || '';
                const address = f['地址'] || f[keys[4]] || '';
                const note = f['備註'] || f[keys[5]] || '';

                const mapUrl = getMapLink(address || localName || name);
                html += `
                    <details>
                        <summary>
                            <div>
                                <span class="tag">🍽️ ${type}</span>
                                <span style="font-weight:bold;">${name}</span>
                                <span class="sub-text">${date}</span>
                            </div>
                        </summary>
                        <div class="content-inner">
                            <div class="info-row"><b>餐廳(Local):</b> ${localName}</div>
                            ${address ? `<div class="info-row"><b>地址:</b> <br><a href="${mapUrl}" class="map-link" target="_blank">📍 ${address}</a></div>` : ''}
                            ${note ? `<div class="info-row"><b>備註:</b> ${note}</div>` : ''}
                        </div>
                    </details>`;
            });
            container.innerHTML = html;
        }

        // === 天氣系統邏輯 ===
        async function loadWeather() {
            const today = new Date();
            
            // 判斷行程所在的城市
            let city = 'Seoul';
            let lat = 37.5665;
            let lon = 126.9780;
            let query = '首爾天氣';
            
            // 7/14 ~ 7/19 在福岡
            if (today >= new Date('2026/07/14') && today <= new Date('2026/07/19')) {
                city = 'Fukuoka';
                lat = 33.5902;
                lon = 130.4017;
                query = '福岡天氣';
            } 
            // 7/20 之後回台灣 (高雄)
            else if (today >= new Date('2026/07/20')) {
                city = 'Kaohsiung';
                lat = 22.6273;
                lon = 120.3014;
                query = '高雄天氣';
            }

            try {
                // 呼叫免 API Key 的氣象開源服務 (Open-Meteo)
                const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`);
                const weatherData = await res.json();
                const temp = weatherData.current_weather.temperature;
                const code = weatherData.current_weather.weathercode;
                
                // 簡易氣象代碼轉 Emoji
                let icon = '🌤️';
                if (code === 0) icon = '☀️';
                else if (code <= 3) icon = '⛅';
                else if (code <= 48) icon = '🌫️';
                else if (code <= 67) icon = '🌧️';
                else if (code <= 77) icon = '❄️';
                else icon = '⛈️';

                // 更新 UI
                document.getElementById('weather-icon').innerText = icon;
                document.getElementById('weather-temp').innerText = `${Math.round(temp)}°C`;
                document.getElementById('weather-city').innerText = city;
                document.getElementById('weather-link').href = `https://www.google.com/search?q=${encodeURIComponent(query)}`;
                
            } catch (err) {
                console.error("天氣讀取失敗", err);
                document.getElementById('weather-temp').innerText = "--°C";
                document.getElementById('weather-city').innerText = "天氣無法讀取";
            }
        }

        // 頁面載入時執行
        window.onload = () => {
            loadWeather(); // 載入天氣
            loadAllData(); // 載入試算表資料
        };
    </script>
</body>
</html>
