<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Trip Expense Dashboard</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        :root {
            --bg-color: #0b111e;
            --card-bg: #151c2b;
            --text-main: #f0f6fc;
            --text-sub: #8b949e;
            --accent: #58a6ff;
            --border: #30363d;
            --expense-bg: #1f2937;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, sans-serif; background-color: var(--bg-color); color: var(--text-main); line-height: 1.5; padding: 20px; max-width: 600px; margin: 0 auto; }
        #offline-banner { display: none; background-color: #b91c1c; color: white; text-align: center; padding: 8px; font-size: 0.85rem; font-weight: bold; border-radius: 8px; margin-bottom: 20px; }
        .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 30px; padding-bottom: 20px; border-bottom: 1px solid var(--border); }
        .header h1 { font-size: 1.5rem; color: var(--text-main); margin: 0;}
        .back-btn { background: rgba(255, 255, 255, 0.1); color: var(--text-main); text-decoration: none; padding: 8px 15px; border-radius: 20px; font-size: 0.9rem; transition: background 0.3s; }
        .back-btn:hover { background: rgba(255, 255, 255, 0.2); }
        .expense-dashboard { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 25px; }
        .expense-card { background: var(--expense-bg); padding: 20px; border-radius: 12px; text-align: center; border: 1px solid var(--border); box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .expense-total { font-size: 1.8rem; font-weight: bold; color: var(--accent); margin-top: 5px; }
        .list-container { background: var(--card-bg); padding: 20px; border-radius: 12px; border: 1px solid var(--border); }
        .list-title { font-weight: bold; margin-bottom: 15px; border-bottom: 1px solid var(--border); padding-bottom: 10px; font-size: 1.1rem;}
        .expense-list-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border); }
        .expense-list-item:last-child { border-bottom: none; }
        .item-info { display: flex; flex-direction: column; }
        .item-name { font-weight: bold; font-size: 1rem;}
        .item-meta { font-size: 0.8rem; color: var(--text-sub); margin-top: 4px;}
        .item-price { font-weight: bold; color: var(--accent); font-size: 1.1rem; }
        .empty-state { text-align: center; color: var(--text-sub); padding: 40px 0; }
        .loading { text-align: center; color: var(--accent); padding: 40px 0; font-weight: bold; }
        /* 專屬除錯紅框樣式 */
        .error-box { background: rgba(255,0,0,0.1); border: 1px solid #ff4d4d; color: #ff4d4d; padding: 20px; border-radius: 10px; margin-top: 20px; word-break: break-all; font-size: 0.95rem; }
    </style>
</head>
<body>

    <div id="offline-banner">⚠️ 目前為離線模式，顯示上次備份資料</div>

    <div class="header">
        <h1>💰 旅費記帳板</h1>
        <a href="index.html" class="back-btn">← 回主行程</a>
    </div>

    <div id="content"><div class="loading">📡 從 Google Sheet 同步資料中...</div></div>

    <script>
        // 【除錯機制 1】全域捕捉 JavaScript 崩潰錯誤
        window.addEventListener('error', function(event) {
            document.getElementById('content').innerHTML = `<div class="error-box">❌ 系統崩潰錯誤: <br>${event.message}</div>`;
        });

        const SHEET_ID = '1zGg0PWmEts0EGzBANZOEVV2437I-OXTHvzlDquMO_VA';

        function fetchExpenseData() {
            // 【除錯機制 2】檢查套件是否被防火牆阻擋
            if (typeof Papa === 'undefined') {
                document.getElementById('content').innerHTML = `<div class="error-box">❌ 解析套件載入失敗。<br>這通常是因為公司內部網路防火牆，或是瀏覽器的「擋廣告外掛」阻擋了連線。請嘗試切換至手機網路，或暫時關閉擋廣告外掛後重新整理。</div>`;
                return;
            }

            const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent('花費')}`;
            
            try {
                Papa.parse(url, {
                    download: true,
                    header: true,
                    skipEmptyLines: true,
                    complete: results => {
                        // 【除錯機制 3】避開無痕模式封鎖 localStorage 的問題
                        try {
                            localStorage.setItem('trip_expense', JSON.stringify(results.data));
                        } catch(e) {
                            console.warn("無法寫入 localStorage，可能處於高隱私模式", e);
                        }
                        
                        document.getElementById('offline-banner').style.display = 'none';
                        renderExpense(results.data);
                    },
                    error: err => {
                        document.getElementById('offline-banner').style.display = 'block';
                        let backup = null;
                        try { backup = localStorage.getItem('trip_expense'); } catch(e) {}
                        
                        if (backup) {
                            renderExpense(JSON.parse(backup));
                        } else {
                            // 顯示明確的抓取失敗原因
                            document.getElementById('content').innerHTML = `<div class="error-box">❌ 抓取資料失敗！<br>錯誤代碼：${err.message || JSON.stringify(err)}<br><br>請確認：<br>1. 試算表是否已「發布到網路」<br>2. 該分頁名稱是否確實為「花費」</div>`;
                        }
                    }
                });
            } catch (err) {
                document.getElementById('content').innerHTML = `<div class="error-box">❌ 解析器執行崩潰：<br>${err.message}</div>`;
            }
        }

        function renderExpense(data) {
            const container = document.getElementById('content');
            
            // 【除錯機制 4】防呆：如果抓回來的是 Google 登入網頁，而非 CSV 資料
            if (data && data.length > 0) {
                const firstKey = Object.keys(data[0])[0] || '';
                if (firstKey.toLowerCase().includes('doctype') || firstKey.toLowerCase().includes('html')) {
                    container.innerHTML = `<div class="error-box">❌ 權限錯誤！<br>程式抓到了 Google 的登入/錯誤頁面，而不是您的記帳資料。<br><br>👉 請回到試算表，點擊左上角「檔案」 > 「共用」 > 「發布到網路」 > 點擊藍色「發布」。</div>`;
                    return;
                }
            }

            if (!data || data.length === 0) { 
                container.innerHTML = `<div class="empty-state">尚未填寫花費紀錄<br><span style="font-size:0.9em; margin-top:10px; display:inline-block;">請至 Google Sheet 的「花費」分頁新增資料</span></div>`; 
                return; 
            }
            
            let totalKRW = 0;
            let totalJPY = 0;
            let listHtml = '';

            data.forEach(e => {
                const currency = (e['幣別'] || '').toUpperCase();
                const amount = parseFloat(e['金額']) || 0;
                
                if (currency.includes('KRW')) totalKRW += amount;
                if (currency.includes('JPY')) totalJPY += amount;

                if(e['項目'] || e['分類']) {
                    listHtml += `
                    <div class="expense-list-item">
                        <div class="item-info">
                            <span class="item-name">${e['項目'] || '未命名項目'}</span>
                            <span class="item-meta">${e['日期'] || ''} | ${e['分類'] || ''}</span>
                        </div>
                        <div class="item-price">${currency} ${amount.toLocaleString()}</div>
                    </div>`;
                }
            });

            container.innerHTML = `
                <div class="expense-dashboard">
                    <div class="expense-card">
                        <div style="font-size:0.9em; color:var(--text-sub);">累積花費 (韓元)</div>
                        <div class="expense-total">₩ ${totalKRW.toLocaleString()}</div>
                    </div>
                    <div class="expense-card">
                        <div style="font-size:0.9em; color:var(--text-sub);">累積花費 (日幣)</div>
                        <div class="expense-total">¥ ${totalJPY.toLocaleString()}</div>
                    </div>
                </div>
                <div class="list-container">
                    <div class="list-title">消費明細</div>
                    ${listHtml}
                </div>
            `;
        }

        window.onload = fetchExpenseData;
    </script>
</body>
</html>
